<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon APLIFA | Connexion</title>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Styles CSS natifs intégrés pour garantir l'affichage sans dépendance externe */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #e2e8f0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .card-container {
            max-width: 28rem;
            width: 100%;
            background-color: #0d1527;
            border-radius: 35px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid #1e293b;
        }
        .text-center { text-align: center; }
        .logo-box {
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #10b981;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff;
            margin-top: 0.75rem;
            letter-spacing: -0.025em;
        }
        .subtitle {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }
        .tabs {
            display: flex;
            background-color: #131c31;
            padding: 0.375rem;
            border-radius: 1rem;
            border: 1px solid #1e293b;
            gap: 0.5rem;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #94a3b8;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #0f172a;
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.375rem;
        }
        input {
            width: 100%;
            padding: 0.875rem 1rem;
            background-color: #131c31;
            border: 1px solid #1e293b;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #10b981;
        }
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background-color: #10b981;
            color: #0f172a;
            font-weight: 700;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-top: 0.5rem;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #059669;
        }
        .info-box {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-size: 11px;
            color: #34d399;
            margin-bottom: 1rem;
        }
        .footer-link {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(30, 41, 59, 0.8);
            text-align: center;
        }
        .footer-link a {
            font-size: 0.75rem;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            transition: color 0.2s;
        }
        .footer-link a:hover {
            color: #ffffff;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- CARTE GLOBALE DE CONNEXION -->
    <div class="card-container">
        
        <!-- EN-TÊTE AVEC LOGO ET TITRES -->
        <div class="text-center">
            <div class="logo-box">
                <img src="logo.jpeg" alt="Logo APLIFA">
            </div>
            <h1>PORTAIL  AGENT</h1>
            <p class="subtitle">Accédez à votre espace Opérationnel</p>
        </div>

        <!-- SÉLECTEUR DE MODE (ONGLETS) -->
        <div class="tabs">
            <button type="button" onclick="changerMode('connexion')" id="btn-mode-connexion" class="tab-btn active">
                Connexion
            </button>
            <button type="button" onclick="changerMode('premiere')" id="btn-mode-premiere" class="tab-btn">
                Première Connexion
            </button>
        </div>

        <!-- FORMULAIRE 1 : CONNEXION CLASSIQUE -->
        <form id="form-connexion" onsubmit="gererConnexion(event)">
            <div class="form-group">
                <label>Numéro de téléphone</label>
                <input type="tel" id="login-telephone" maxlength="10" required placeholder="+243...">
            </div>

            <div class="form-group">
                <label>Code secret / PIN (4 chiffres)</label>
                <input type="password" id="login-pin" maxlength="4" required placeholder="••••" style="letter-spacing: 0.2em;">
            </div>

            <button type="submit" class="btn-submit">
                Se Connecter
            </button>
        </form>

        <!-- FORMULAIRE 2 : PREMIÈRE CONNEXION (ACTIVATION) -->
        <form id="form-premiere" onsubmit="gererPremiereConnexion(event)" class="hidden">
            <div class="info-box">
                <i class="fa-solid fa-circle-info mr-1"></i> Saisissez votre numéro enregistré et le code unique d'accès fourni par l'administration.
            </div>

            <div class="form-group">
                <label>Numéro de téléphone</label>
                <input type="tel" id="first-telephone" maxlength="10" required placeholder="+243...">
            </div>

            <div class="form-group">
                <label>Code Unique Reçu</label>
                <input type="text" id="first-codeunique" maxlength="10" required placeholder="Ex: AP-12345" style="text-transform: uppercase; letter-spacing: 0.1em; color: #34d399; font-weight: bold;">
            </div>

            <div class="form-group">
                <label>Créer un Code PIN (4 chiffres)</label>
                <input type="password" id="first-pin" maxlength="4" required placeholder="••••" style="letter-spacing: 0.2em;">
            </div>

            <button type="submit" class="btn-submit">
                Activer mon compte & Connexion
            </button>
        </form>

        <!-- LIEN REDIRECTION VERS CHANGEMENT DE CODE PIN -->
        <div class="footer-link">
            <a href="changer.html">
                <i class="fa-solid fa-lock" style="color: #fbbf24; margin-right: 0.35rem;"></i> Changer mon code PIN
            </a>
        </div>

    </div>

    <!-- LOGIQUE FIREBASE & INTERACTION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxtMLS_VyhSVSooqJCDjUQShgSgSPTdXo",
            authDomain: "suivi-gps-48811.firebaseapp.com",
            projectId: "suivi-gps-48811",
            storageBucket: "suivi-gps-48811.firebasestorage.app",
            messagingSenderId: "147934111832",
            appId: "1:147934111832:web:42a5f278d0636c17f4c22d"
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        // --- NOUVEAU : Charger automatiquement les identifiants enregistrés sur ce téléphone ---
        window.addEventListener('DOMContentLoaded', () => {
            const savedTel = localStorage.getItem('agent_saved_tel');
            const savedPin = localStorage.getItem('agent_saved_pin');

            if (savedTel) {
                document.getElementById('login-telephone').value = savedTel;
            }
            if (savedPin) {
                document.getElementById('login-pin').value = savedPin;
            }
        });

        window.changerMode = function(mode) {
            const btnConnexion = document.getElementById('btn-mode-connexion');
            const btnPremiere = document.getElementById('btn-mode-premiere');
            const formConnexion = document.getElementById('form-connexion');
            const formPremiere = document.getElementById('form-premiere');

            if(mode === 'connexion') {
                btnConnexion.classList.add('active');
                btnPremiere.classList.remove('active');
                formConnexion.classList.remove('hidden');
                formPremiere.classList.add('hidden');
            } else {
                btnPremiere.classList.add('active');
                btnConnexion.classList.remove('active');
                formPremiere.classList.remove('hidden');
                formConnexion.classList.add('hidden');
            }
        }

        window.gererConnexion = async function(e) {
            e.preventDefault();
            const telephone = document.getElementById('login-telephone').value.trim();
            const pin = document.getElementById('login-pin').value.trim();

            try {
                const q = query(collection(db, "agents_kyc"), where("telephone", "==", telephone), where("pin", "==", pin));
                const querySnapshot = await getDocs(q);

                if(!querySnapshot.empty) {
                    const agentDoc = querySnapshot.docs[0].data();
                    
                    // --- Mémorisation locale pour le même téléphone ---
                    localStorage.setItem('agent_saved_tel', telephone);
                    localStorage.setItem('agent_saved_pin', pin);
                    
                    localStorage.setItem('agent_connecte_tel', telephone);
                    localStorage.setItem('agent_connecte_nom', `${agentDoc.nom} ${agentDoc.prenom}`);
                    
                    alert("Connexion réussie ! Bienvenue " + agentDoc.nom);
                    window.location.href = "agent.html";
                } else {
                    alert("Numéro de téléphone ou code PIN incorrect.");
                }
            } catch(err) {
                alert("Erreur de connexion : " + err.message);
            }
        }

        window.gererPremiereConnexion = async function(e) {
            e.preventDefault();
            const telephone = document.getElementById('first-telephone').value.trim();
            const codeUnique = document.getElementById('first-codeunique').value.trim().toUpperCase();
            const nouveauPin = document.getElementById('first-pin').value.trim();

            try {
                const q = query(collection(db, "agents_kyc"), where("telephone", "==", telephone), where("codeAcces", "==", codeUnique));
                const snap = await getDocs(q);

                if(snap.empty) {
                    alert("Combinaison numéro de téléphone / code d'accès invalide !");
                    return;
                }

                const agentId = snap.docs[0].id;
                const agentData = snap.docs[0].data();

                if(agentData.pin) {
                    alert("Ce compte a déjà été activé. Veuillez utiliser la connexion classique.");
                    changerMode('connexion');
                    return;
                }

                await updateDoc(doc(db, "agents_kyc", agentId), { 
                    pin: nouveauPin,
                    statut: "Actif" 
                });

                // --- Mémorisation automatique après la première activation réussie ---
                localStorage.setItem('agent_saved_tel', telephone);
                localStorage.setItem('agent_saved_pin', nouveauPin);

                localStorage.setItem('agent_connecte_tel', telephone);
                localStorage.setItem('agent_connecte_nom', `${agentData.nom} ${agentData.prenom}`);

                alert("Compte activé avec succès ! Redirection vers votre espace...");
                window.location.href = "agent.html";

            } catch(err) {
                alert("Erreur lors de l'activation : " + err.message);
            }
        }
    </script>
</body>
</html>
