<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APLIFA | Changer le Code PIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #10b981;
            --accent-hover: #059669;
            --bggray: #f1f5f9;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bggray);
            color: var(--slate-800);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .wrapper {
            max-width: 28rem;
            width: 100%;
        }

        .card {
            background-color: var(--slate-900);
            border-radius: 35px;
            padding: 32px;
            color: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--slate-800);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .logo-container {
            width: 64px;
            height: 64px;
            background-color: #ffffff;
            border-radius: 9999px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--slate-700);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 9999px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.025em;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--slate-400);
            margin-top: 2px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-block label {
            font-size: 10px;
            font-weight: 700;
            color: var(--slate-400);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 12px;
            font-size: 12px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field::placeholder {
            color: var(--slate-500);
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .input-pin {
            letter-spacing: 0.2em;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: #030712;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .footer-link {
            text-align: center;
            padding-top: 8px;
        }

        .footer-link a {
            font-size: 12px;
            color: var(--slate-400);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            transition: color 0.2s;
        }

        .footer-link a:hover {
            color: #ffffff;
        }

        .footer-link i {
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <!-- CARTE PRINCIPALE NOIRE AUX BORDS ARRONDIS -->
        <div class="card">
            
            <!-- EN-TÊTE AVEC LE LOGO -->
            <div class="header-section">
                <div class="logo-container">
                    <img src="logo.jpeg" alt="Logo APLIFA">
                </div>
                <div>
                    <h1 class="title">Changer le Code PIN</h1>
                    <p class="subtitle">Mettez à jour votre code secret de sécurité</p>
                </div>
            </div>

            <!-- FORMULAIRE DE CHANGEMENT DE PIN -->
            <form id="form-change-pin" onsubmit="gererChangementPin(event)" class="form-group">
                
                <div class="input-block">
                    <label>Numéro de téléphone</label>
                    <input type="tel" id="change-telephone" maxlength="10" required placeholder="+243..." class="input-field">
                </div>

                <div class="input-block">
                    <label>Ancien Code PIN (4 chiffres)</label>
                    <input type="password" id="old-pin" maxlength="4" required placeholder="••••" class="input-field input-pin">
                </div>

                <div class="input-block">
                    <label>Nouveau Code PIN (4 chiffres)</label>
                    <input type="password" id="new-pin" maxlength="4" required placeholder="••••" class="input-field input-pin">
                </div>

                <div class="input-block">
                    <label>Confirmer le nouveau PIN</label>
                    <input type="password" id="confirm-pin" maxlength="4" required placeholder="••••" class="input-field input-pin">
                </div>

                <button type="submit" class="btn-submit">
                    Mettre à jour le Code PIN
                </button>
            </form>

            <!-- LIEN RETOUR -->
            <div class="footer-link">
                <a href="index.html">
                    <i class="fa-solid fa-arrow-left"></i> Retour à la connexion
                </a>
            </div>

        </div>

    </div>

    <!-- LOGIQUE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxtMLS_VyhSVSooqJCDjUQShgSgSPTdXo",
            authDomain: "suivi-gps-48811.firebaseapp.com",
            projectId: "suivi-gps-48811",
            storageBucket: "suivi-gps-48811.firebasestorage.app",
            messagingSenderId: "147934111832",
            appId: "1:147934111832:web:42a5f278d0636c17f4c22d"
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        window.gererChangementPin = async function(e) {
            e.preventDefault();
            const telephone = document.getElementById('change-telephone').value.trim();
            const oldPin = document.getElementById('old-pin').value.trim();
            const newPin = document.getElementById('new-pin').value.trim();
            const confirmPin = document.getElementById('confirm-pin').value.trim();

            if (newPin !== confirmPin) {
                alert("Le nouveau code PIN et la confirmation ne correspondent pas.");
                return;
            }

            if (newPin.length !== 4 || isNaN(newPin)) {
                alert("Le code PIN doit être composé exactement de 4 chiffres.");
                return;
            }

            try {
                const q = query(collection(db, "agents_kyc"), where("telephone", "==", telephone));
                const snap = await getDocs(q);

                if (snap.empty) {
                    alert("Aucun agent trouvé avec ce numéro de téléphone.");
                    return;
                }

                const agentDocSnap = snap.docs[0];
                const agentData = agentDocSnap.data();

                if (agentData.pin !== oldPin) {
                    alert("L'ancien code PIN est incorrect.");
                    return;
                }

                await updateDoc(doc(db, "agents_kyc", agentDocSnap.id), {
                    pin: newPin
                });

                alert("Votre code PIN a été mis à jour avec succès !");
                window.location.href = "index.html";

            } catch (err) {
                alert("Erreur lors de la mise à jour : " + err.message);
            }
        }
    </script>
</body>
</html>
